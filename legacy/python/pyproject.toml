[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-llm-benchmark"
version = "0.1.0"
description = "Prolific study backend for doctor, patient and lab agent experiments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "alembic>=1.15,<2", "httpx>=0.28,<1",
  "pydantic-settings>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
