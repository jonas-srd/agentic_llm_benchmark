name: Test and build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: benchmark
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U benchmark" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://benchmark:test-only@localhost:5432/benchmark
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:web
      - run: docker build -t clinical-api .
      - run: docker build -f apps/web/Dockerfile -t clinical-web .
