services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark"]
      interval: 3s
      retries: 20
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://benchmark:local-development-only@postgres:5432/benchmark
    command: ["sh", "-c", "alembic upgrade head && python -m app.server"]
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://benchmark:local-development-only@postgres:5432/benchmark
    command: ["python", "-m", "app.worker"]
    depends_on: [api]
volumes:
  postgres:
